<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Time Tracking - Practice Manager</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-shell">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="topbar"><h1 id="pageTitle">Time Tracking</h1></div>
    <div class="content">
      <div class="stat-grid" id="summaryGrid" style="display:none;"></div>
      <div class="toolbar">
        <select id="filterClient" style="max-width:220px;"><option value="">All clients</option></select>
        <select id="filterTask" style="max-width:220px;"><option value="">All tasks</option></select>
        <div class="spacer"></div>
        <button class="btn" id="addBtn">+ Log Time</button>
      </div>
      <div class="card" style="padding:0;">
        <table>
          <thead><tr><th>Date</th><th>Staff</th><th>Client</th><th>Task</th><th>Duration</th><th>Notes</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty-state" id="emptyState" style="display:none;">No time entries yet.</div>
      </div>
      <p class="muted" style="font-size:12px;" id="scopeNote"></p>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <span class="close-x" id="closeModal">&times;</span>
    <h2 id="modalTitle">Log Time</h2>
    <form id="itemForm">
      <input type="hidden" id="itemId">
      <div class="form-grid">
        <div class="form-row"><label>Client</label><select id="f_client"><option value="">(Internal / none)</option></select></div>
        <div class="form-row"><label>Task</label><select id="f_task"><option value="">(None)</option></select></div>
        <div class="form-row"><label>Date *</label><input id="f_date" type="date" required></div>
        <div class="form-row"><label>Duration (minutes) *</label><input id="f_minutes" type="number" min="1" required placeholder="e.g. 45"></div>
      </div>
      <div class="form-row"><label>Notes — what the time was spent on</label><textarea id="f_notes" rows="3"></textarea></div>
      <div class="toolbar">
        <button type="button" class="btn danger" id="deleteBtn" style="display:none;">Delete</button>
        <div class="spacer"></div>
        <button type="button" class="btn secondary" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn">Save</button>
      </div>
      <div class="error-msg" id="formError"></div>
    </form>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
let items = [], clients = [], tasks = [], me;
const clientMap = {}, taskMap = {};

function fmtMinutes(m) {
  const h = Math.floor(m / 60), mm = m % 60;
  return h ? `${h}h ${mm}m` : `${mm}m`;
}

function renderRows() {
  const clientId = document.getElementById('filterClient').value;
  const taskId = document.getElementById('filterTask').value;
  const params = new URLSearchParams();
  if (clientId) params.set('clientId', clientId);
  if (taskId) params.set('taskId', taskId);
  api('/time' + (params.toString() ? '?' + params.toString() : '')).then((list) => {
    items = list;
    const rows = document.getElementById('rows');
    document.getElementById('emptyState').style.display = list.length ? 'none' : 'block';
    rows.innerHTML = list.map((t) => `
      <tr data-id="${t.id}" style="cursor:pointer;">
        <td>${formatDate(t.date)}</td>
        <td>${escapeHtml(t.staff || '-')}</td>
        <td>${escapeHtml(clientMap[t.clientId] || '-')}</td>
        <td>${escapeHtml(taskMap[t.taskId] || '-')}</td>
        <td>${fmtMinutes(t.minutes)}</td>
        <td class="muted">${escapeHtml(t.notes || '')}</td>
      </tr>
    `).join('');
    rows.querySelectorAll('tr').forEach((tr) => tr.addEventListener('click', () => openModal(items.find((i) => i.id === tr.dataset.id))));
  });
}

function openModal(item) {
  document.getElementById('formError').textContent = '';
  const deleteBtn = document.getElementById('deleteBtn');
  if (item) {
    document.getElementById('modalTitle').textContent = 'Edit Time Entry';
    document.getElementById('itemId').value = item.id;
    document.getElementById('f_client').value = item.clientId || '';
    document.getElementById('f_task').value = item.taskId || '';
    document.getElementById('f_date').value = item.date;
    document.getElementById('f_minutes').value = item.minutes;
    document.getElementById('f_notes').value = item.notes || '';
    deleteBtn.style.display = 'inline-flex';
  } else {
    document.getElementById('modalTitle').textContent = 'Log Time';
    document.getElementById('itemForm').reset();
    document.getElementById('itemId').value = '';
    document.getElementById('f_date').value = new Date().toISOString().slice(0, 10);
    deleteBtn.style.display = 'none';
  }
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

(async () => {
  me = await renderShell('/time.html', 'Time Tracking');
  [clients, tasks] = await Promise.all([api('/clients'), api('/tasks')]);
  clients.forEach((c) => clientMap[c.id] = c.name);
  tasks.forEach((t) => taskMap[t.id] = t.title);

  const clientOptions = clients.map((c) => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
  document.getElementById('f_client').innerHTML += clientOptions;
  document.getElementById('filterClient').innerHTML += clientOptions;
  const taskOptions = tasks.map((t) => `<option value="${t.id}">${escapeHtml(t.title)}</option>`).join('');
  document.getElementById('f_task').innerHTML += taskOptions;
  document.getElementById('filterTask').innerHTML += taskOptions;

  document.getElementById('scopeNote').textContent = 'You are only seeing your own time entries.';
  try {
    const summary = await api('/time/summary');
    document.getElementById('scopeNote').textContent = 'Showing time entries for the whole team (you have firm-wide visibility).';
    const totalMinutes = Object.values(summary.byStaff).reduce((a, b) => a + b, 0);
    const grid = document.getElementById('summaryGrid');
    grid.style.display = 'grid';
    grid.innerHTML = `
      <div class="stat-card"><div class="label">Total Logged</div><div class="value">${fmtMinutes(totalMinutes)}</div></div>
      <div class="stat-card"><div class="label">Staff Members Logging Time</div><div class="value">${Object.keys(summary.byStaff).length}</div></div>
      <div class="stat-card"><div class="label">Clients With Time Logged</div><div class="value">${Object.keys(summary.byClient).filter((k) => k !== '(unassigned)').length}</div></div>
    `;
  } catch (e) {
    // No firm-wide permission — that's expected for most staff; the page
    // still works scoped to their own entries (see routes/time.js).
  }

  renderRows();
  document.getElementById('filterClient').addEventListener('change', renderRows);
  document.getElementById('filterTask').addEventListener('change', renderRows);
  document.getElementById('addBtn').addEventListener('click', () => openModal(null));
  document.getElementById('closeModal').addEventListener('click', closeModal);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);

  document.getElementById('itemForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('itemId').value;
    const payload = {
      clientId: document.getElementById('f_client').value,
      taskId: document.getElementById('f_task').value,
      date: document.getElementById('f_date').value,
      minutes: Number(document.getElementById('f_minutes').value),
      notes: document.getElementById('f_notes').value.trim(),
    };
    try {
      if (id) await api('/time/' + id, { method: 'PUT', body: payload });
      else await api('/time', { method: 'POST', body: payload });
      renderRows();
      closeModal();
    } catch (err) {
      document.getElementById('formError').textContent = err.message;
    }
  });

  document.getElementById('deleteBtn').addEventListener('click', async () => {
    const id = document.getElementById('itemId').value;
    if (!confirm('Delete this time entry?')) return;
    await api('/time/' + id, { method: 'DELETE' });
    renderRows();
    closeModal();
  });
})();
</script>
</body>
</html>
